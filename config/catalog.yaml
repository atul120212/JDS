# Curated, live-verified directory of company career pages, organized by region.
#
# This is NOT scraped automatically - it is a catalog to browse and pick from.
# Add an entry as an actual source via the web UI (Sources -> Browse catalog),
# `python -m jd_collector catalog add <name>`, or the POST /catalog/add API.
#
# Every entry was checked against the company's real career-page API before being
# added here, so adding one works immediately. "region" is the company's HQ region
# (not a guarantee every open role is based there) and uses the same region names
# jobs are auto-classified into, so catalog and job-search regions line up.

